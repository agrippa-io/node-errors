name: ci

# PR gates for a private @agrippa-io library (github-actions archetype 1).
# Every job feeds `ci-ok`, the single check the org ruleset requires.

on:
  pull_request:
    branches: [develop, 'release/**', main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: agrippa-io/github-actions/.github/workflows/npm-lint.yml@v1
    with:
      npm-scope: '@agrippa-io'
      lint-paths: '.'
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agrippa-io/github-actions/npm/actions/setup-node-project@v1
        with:
          npm-scope: '@agrippa-io'
          npm-token: ${{ secrets.NPM_TOKEN }}
      - run: npm run typecheck

  test:
    uses: agrippa-io/github-actions/.github/workflows/npm-test.yml@v1
    with:
      npm-scope: '@agrippa-io'
      test-command: 'vitest run --coverage'
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  build:
    needs: [lint, typecheck, test]
    uses: agrippa-io/github-actions/.github/workflows/npm-build.yml@v1
    with:
      npm-scope: '@agrippa-io'
      upload-artifact: false
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  gitleaks:
    uses: agrippa-io/github-actions/.github/workflows/gitleaks.yml@v1.9.1

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, typecheck, test, build, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.typecheck.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.gitleaks.result }}" = "success" ]

  # Publish the TypeDoc JSON to the docs platform (docs-platform-0 14.1, D1: CI
  # pushes on every merge). Runs after the ci-ok gate; not part of it.
  publish-docs:
    needs: ci-ok
    uses: agrippa-io/github-actions/.github/workflows/publish-docs.yml@v1.13.0
    with:
      kind: library
      build-command: npm run docs:typedoc
      format: typedoc
      spec-path: docs/typedoc.json
      name: '@agrippa-io/node-errors'
      # Dry run on pull requests; on merges it publishes once vars.DOCS_API_URL
      # and the docs credentials exist (until then it dry-runs with a notice).
      dry-run: ${{ github.event_name == 'pull_request' && 'true' || 'auto' }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
      docs-client-secret: ${{ secrets.DOCS_PUBLISH_CLIENT_SECRET }}
