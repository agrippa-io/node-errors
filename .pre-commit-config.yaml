# Local git hooks (https://pre-commit.com). Install once per clone:
#   pre-commit install
# gitleaks blocks commits that add secrets; CI runs the same scan
# (agrippa-io/github-actions gitleaks.yml). False positives: .gitleaksignore.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
